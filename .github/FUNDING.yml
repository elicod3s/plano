# Puts a "Sponsor" button at the top of the repo, next to Star and Fork.
#
# Ko-fi is the live one: it takes PayPal as well as cards, needs no account on the donor's side,
# and keeps 0% on one-off donations.
#
# `github:` renders only once GitHub Sponsors is actually enabled on the account (Settings →
# Sponsors → profile, identity and bank verification, which runs through Stripe Connect and is
# therefore country-limited). It is listed first so it takes over as the primary link the moment
# that approval lands — recurring sponsorships convert better than one-off tips — without anyone
# having to remember to edit this file. Until then GitHub ignores the entry and shows Ko-fi.

github: [zqkra]
ko_fi: zqkra
